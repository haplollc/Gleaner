<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img"><defs></defs><rect width="960" height="340" rx="22" fill="#F6F7F9"/><text x="40" y="52" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#17202A" text-anchor="start" opacity="1">One call, 4,096 tokens</text><text x="40" y="78" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6773" text-anchor="start" opacity="1">Everything shares the same window: what you say, what the schema costs, and what the model says back.</text><rect x="40" y="120" width="25.78125" height="70" rx="10" fill="#ECE6FF" stroke="#7B5CE0" stroke-width="2" /><rect x="65.78125" y="120" width="35.6640625" height="70" rx="10" fill="#FDEBD3" stroke="#D9822B" stroke-width="2" /><rect x="101.4453125" y="120" width="615.52734375" height="70" rx="10" fill="#E3EDFF" stroke="#2F6FEB" stroke-width="2" /><rect x="716.97265625" y="120" width="52.63671875" height="70" rx="10" fill="#E6EAEF" stroke="#9AA5B1" stroke-width="2" /><rect x="769.609375" y="120" width="150.390625" height="70" rx="10" fill="#DDF5EA" stroke="#17A06B" stroke-width="2" /><text x="409.208984375" y="152" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2F6FEB" text-anchor="middle" opacity="1">Your data</text><text x="409.208984375" y="174" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#5B6773" text-anchor="middle" opacity="1">2,865 tokens, packed to fit</text><text x="844.8046875" y="152" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#17A06B" text-anchor="middle" opacity=